<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0F15">
<meta name="color-scheme" content="dark">
<meta name="description" content="Log your lifts fast.">
<title>Setline</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7A67F2"/><stop offset="1" stop-color="#C6BBFA"/></linearGradient>
</defs></svg>

<div class="app" id="app">
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

  <section class="screen" id="s-today" data-screen="today" aria-label="Today"></section>
  <section class="screen" id="s-workout" data-screen="workout" aria-label="Workout"></section>
  <section class="screen" id="s-history" data-screen="history" aria-label="History"></section>
  <section class="screen" id="s-detail" data-screen="detail" aria-label="Workout details"></section>
  <section class="screen" id="s-settings" data-screen="settings" aria-label="Settings"></section>

  <button class="minibar solid" id="minibar" data-act="go" data-to="workout" tabindex="-1"></button>
  <nav class="dock glass" id="dock" aria-label="Main"></nav>

  <section class="vlayer" id="voice" data-phase="idle" hidden></section>
  <div class="toast glass" id="toast" role="status" aria-live="polite"></div>
  <div class="intent glass" id="intent" role="status" aria-live="polite"></div>
  <button class="update glass" id="update" tabindex="-1"></button>
</div>
<noscript>Setline needs JavaScript.</noscript>
</body>
</html>
