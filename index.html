<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0D0F15">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0F15">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#0D0F15">
<meta name="color-scheme" content="dark only">
<meta name="darkreader-lock">
<meta name="description" content="Log your lifts fast.">
<title>Setline</title>
<script>try{var a=JSON.parse(localStorage.getItem("setline.settings")||"{}").accent;if(a)document.documentElement.dataset.accent=a}catch(e){}</script>
<link rel="stylesheet" href="css/motion.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient>
  <linearGradient id="sf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent)" stop-opacity=".28"/><stop offset="1" style="stop-color:var(--accent)" stop-opacity="0"/></linearGradient>
  <linearGradient id="sp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient>
</defs></svg>

<div class="app" id="app">
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="edge et" aria-hidden="true"></div><div class="edge eb" aria-hidden="true"></div>

  <section class="screen" id="s-today" data-screen="today" aria-label="Today"></section>
  <section class="screen" id="s-workout" data-screen="workout" aria-label="Workout"></section>
  <div class="aura" aria-hidden="true"><i class="veil"></i><i class="bloom"></i><i class="glow"></i></div>
  <section class="screen" id="s-coach" data-screen="coach" aria-label="Coach"></section>
  <section class="screen" id="s-history" data-screen="history" aria-label="History"></section>
  <section class="screen" id="s-detail" data-screen="detail" aria-label="Workout details"></section>
  <section class="screen" id="s-settings" data-screen="settings" aria-label="Settings"></section>
  <section class="screen" id="s-routine" data-screen="routine" aria-label="Routine"></section>
  <section class="screen" id="s-progress" data-screen="progress" aria-label="Progress"></section>
  <section class="screen" id="s-exercise" data-screen="exercise" aria-label="Exercise"></section>
  <section class="screen" id="s-body" data-screen="body" aria-label="Body"></section>
  <section class="screen" id="s-food" data-screen="food" aria-label="Food"></section>
  <section class="screen" id="s-you" data-screen="you" aria-label="You"></section>

  <button class="minibar solid" id="minibar" data-act="go" data-to="workout" tabindex="-1"></button>
  <form class="composer glass" id="composer" autocomplete="off"></form>
  <nav class="dock glass" id="dock" aria-label="Main"></nav>

  <section class="vlayer" id="voice" data-phase="idle" hidden></section>
  <div class="toast glass" id="toast" role="status" aria-live="polite"></div>
  <div class="intent glass" id="intent" role="status" aria-live="polite"></div>
  <button class="update glass" id="update" tabindex="-1"></button>
</div>
<noscript>Setline needs JavaScript.</noscript>
</body>
</html>
