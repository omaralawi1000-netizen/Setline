name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify (secrets, release bookkeeping, unit tests)
        run: npm run verify
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Golden flows
        run: npm run golden
